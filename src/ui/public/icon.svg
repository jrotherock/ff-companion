<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fantasy Companion">
  <!--
    One shape, two colours.

    The ball drawn as it actually is — a pointed lens, two arcs meeting at
    points, not an ellipse — in the interface's amber on its own near-black,
    cut by a single seam. Nothing else: every version that added laces, cards
    or a monogram read as clip art or as an app whose name happens to start
    with F.
  -->
  <rect width="64" height="64" fill="#0e1116"/>
  <g transform="rotate(-35 32 32)">
    <path d="M3 32 A 37 37 0 0 1 61 32 A 37 37 0 0 1 3 32 Z" fill="#ffb000"/>
    <rect x="29.6" y="10.5" width="4.8" height="43" rx="2.4" fill="#0e1116"/>
  </g>
</svg>
