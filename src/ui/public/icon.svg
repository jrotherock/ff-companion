<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fantasy Companion">
  <!--
    College navy and action green — an original mark, since a palette is not a
    trademark and the bird is.

    A real ball: the seam runs the full length, the laces cluster in the middle
    third where laces actually sit, and they are short. Spread across the whole
    ball they read as a fish skeleton.
  -->
  <rect width="64" height="64" fill="#002244"/>
  <g transform="rotate(-35 32 32)">
    <path d="M4 32 A 36 36 0 0 1 60 32 A 36 36 0 0 1 4 32 Z" fill="#69be28"/>
    <g fill="#002244">
      <rect x="11" y="30.8" width="42" height="2.4" rx="1.2"/>
      <rect x="24.4" y="27.6" width="2.9" height="8.8" rx="1.45"/>
      <rect x="29.2" y="27.1" width="2.9" height="9.8" rx="1.45"/>
      <rect x="34"   y="27.1" width="2.9" height="9.8" rx="1.45"/>
      <rect x="38.8" y="27.6" width="2.9" height="8.8" rx="1.45"/>
    </g>
  </g>
</svg>
