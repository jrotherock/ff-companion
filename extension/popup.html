<!doctype html>
<meta charset="utf-8" />
<style>
  body { width: 280px; margin: 0; padding: 12px; background: #0e1116; color: #e8ecf2;
         font: 12px/1.45 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .04em; text-transform: uppercase; color: #ffb000; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .ok { background: #45d9a0; } .bad { background: #ff5c63; }
  .dot.muted { background: #5c6878; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #2a3441; }
  .row:last-child { border-bottom: none; }
  .muted { color: #8a96a6; }
  .err { color: #ff5c63; margin-top: 8px; word-break: break-word; }
  code { font-family: ui-monospace, monospace; color: #8a96a6; }
  input { width: 100%; box-sizing: border-box; margin: 3px 0; padding: 6px 7px; border-radius: 5px;
          border: 1px solid #2a3441; background: #141a22; color: #e8ecf2; font-size: 12px; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
         color: #8a96a6; margin-top: 7px; }
  button { margin-top: 5px; padding: 5px 11px; border-radius: 5px; border: 1px solid #2a3441;
           background: #1b232d; color: #e8ecf2; font-size: 12px; cursor: pointer; }
</style>
<h1>FF Companion draft sensor</h1>
<div id="body" class="muted">checking…</div>
<h1 style="margin-top:12px">Polling</h1>
<div id="leagues" class="muted">…</div>
<h1 style="margin-top:12px">Companions</h1>
<div class="muted" style="margin-bottom:6px">
  Both get everything this reads. Whichever is down is skipped, not retried.
</div>
<div class="lbl">On this Mac</div>
<input id="base" placeholder="http://localhost:4600" spellcheck="false" />
<input id="token" placeholder="token (usually empty here)" type="password" spellcheck="false" />
<div class="lbl">Hosted</div>
<input id="base2" placeholder="https://roffco.up.railway.app" spellcheck="false" />
<input id="token2" placeholder="token" type="password" spellcheck="false" />
<button id="save">Save</button>
<span id="saved" class="muted"></span>
<script src="popup.js"></script>
